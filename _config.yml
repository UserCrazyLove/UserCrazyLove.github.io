# Jekyll + Chirpy（GitHub Pages 用 GitHub Actions 构建）

theme: jekyll-theme-chirpy

lang: zh-CN
timezone: Asia/Shanghai

title: UserPvp的小窝
tagline: 明辨是非，独立思考
description: >-
  基于 Jekyll Chirpy 主题与 GitHub Pages 的个人博客。

url: "https://userpvp.site"

github:
  username: usercrazylove

twitter:
  username:

social:
  name: UserPvp
  email: ymw133king@gmail.com
  links:
    - https://github.com/usercrazylove

# 个人头像配置
avatar: https://avatars.githubusercontent.com/u/61895636

webmaster_verifications:
  google:
  bing:

analytics:
  google:
    id:

theme_mode:

comments:
  # Cusdis：读者无需注册即可评论；默认「先审后发」，在 https://cusdis.com/dashboard 审核。
  provider: cusdis
  cusdis:
    # App ID 须与 https://cusdis.com/dashboard 嵌入代码里 data-app-id="…" 引号内一致（多为长随机串，不是站点标题）
    app_id: '6547999d-31f6-46db-b2b7-9bec652b0977'
    # 自建实例时填写根 URL，不要末尾斜杠；用官方托管可省略
    # host: 'https://cusdis.com'

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths: []

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;︎"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
