# Jekyll + Chirpy（GitHub Pages 用 GitHub Actions 构建）

theme: jekyll-theme-chirpy

lang: zh-CN
timezone: Asia/Shanghai

title: UserPvp的小窝
tagline: “独立思考，明辨是非”
description: >-
  基于 Jekyll Chirpy 主题与 GitHub Pages 的个人博客。

url: "https://userpvp.site"

github:
  username: usercrazylove

twitter:
  username:

social:
  name: UserPvp
  email: ymw133king@gmail.com
  links:
    - https://github.com/usercrazylove

# 个人头像配置
avatar: https://avatars.githubusercontent.com/u/61895636

webmaster_verifications:
  google:
  bing:

analytics:
  google:
    id:

theme_mode:

comments:
  # Waline 评论区：见 _includes/comments/waline.html
  provider: waline
  # 请先部署 Waline 服务端拿到 serverURL，再填入下方
  waline:
    server_url: https://shuju-six.vercel.app
    placeholder: 说说你此刻的想法…
    avatar: monsterid        # 头像类型：mp, identicon, monsterid, wavatar, retro, robohash, hide
    page_size: 10            # 每页评论数
    lang: zh-CN              # 语言
    visitor: false           # 是否开启文章阅读量统计
    highlight: true          # 代码高亮
    upload_image: false      # 是否开启图片上传
    login: enable            # 社交登录：enable, disable, force
    # 正整数 = 最大字数；不写或 0 表示不限制（由 waline.html 省略 wordLimit 选项）
    word_limit: 0
    required_meta: [nick, mail]  # 必填项：[nick], [mail], [nick, mail]
    reaction: false          # 文章反应（表情反馈）
    recaptcha_v3_key: ''     # Google reCAPTCHA v3 site key

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths: []

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;︎"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
