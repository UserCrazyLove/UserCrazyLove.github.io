{% comment %}
  Cusdis：访客无需账号即可评论（默认需在 https://cusdis.com/dashboard 审核后公开）。
  与 Chirpy 一致，在 footer 前插入，并随侧边栏亮/暗主题设置初始 data-theme。
{% endcomment %}
{% assign _cusdis_app = site.comments.cusdis.app_id | default: '' | strip %}
{% if _cusdis_app == '' %}
  <!-- Cusdis：请在 _config.yml 填写 comments.cusdis.app_id（见 https://cusdis.com/dashboard） -->
{% else %}
<script>
(function () {
  const host = '{{ site.comments.cusdis.host | default: "https://cusdis.com" }}'.replace(/\/$/, '');
  const appId = {{ _cusdis_app | jsonify }};

  const initialTheme =
    typeof Theme !== 'undefined' && Theme.visualState === 'dark' ? 'dark' : 'light';

  const div = document.createElement('div');
  div.id = 'cusdis_thread';
  div.setAttribute('data-host', host);
  div.setAttribute('data-app-id', appId);
  div.setAttribute('data-page-id', {{ page.id | default: page.url | jsonify }});
  div.setAttribute('data-page-url', {{ page.url | absolute_url | jsonify }});
  div.setAttribute('data-page-title', {{ page.title | jsonify }});
  div.setAttribute('data-theme', initialTheme);

  const footer = document.querySelector('footer');
  if (!footer) {
    return;
  }
  footer.insertAdjacentElement('beforebegin', div);

  const script = document.createElement('script');
  script.defer = true;
  script.src = host + '/js/cusdis.es.js';
  document.body.appendChild(script);
})();
</script>
{% endif %}
