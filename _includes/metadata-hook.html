{% if site.comments.provider == 'waline' %}
  <link rel="stylesheet" href="https://unpkg.com/@waline/client@3/dist/waline.css" />
  <style>
    /* 修复 Waline 亮色模式下与 Chirpy 主题的颜色冲突 */
    html:not([data-mode="dark"]) {
      --waline-white: #ffffff;
      --waline-light-grey: #999;
      --waline-dark-grey: #666;
      --waline-text-color: #333333;
      --waline-bg-color: #ffffff;
      --waline-bg-color-light: #f8f9fa;
      --waline-bg-color-hover: #f0f0f0;
      --waline-border-color: #e0e0e0;
      --waline-disable-bg-color: #f8f8f8;
      --waline-disable-color: #bbb;
      --waline-code-bg-color: #282c34;
      --waline-bq-color: #f0f0f0;
      --waline-info-bg-color: #f5f5f5;
      --waline-info-color: #999;
      --waline-info-border-color: #e5e5e5;
    }

    /* 防止 Chirpy 主题样式渗透到 Waline 评论区 */
    #waline,
    #waline * {
      box-sizing: border-box;
    }

    #waline .wl-panel {
      color: var(--waline-text-color, #333);
    }

    #waline .wl-header label {
      color: var(--waline-text-color, #333);
    }

    #waline .wl-card,
    #waline .wl-comment {
      color: var(--waline-text-color, #333);
    }

    #waline a {
      color: var(--waline-theme-color, #3eaf7c);
    }

    #waline .wl-content {
      color: var(--waline-text-color, #333);
    }

    /* 侧栏底部居中对齐：GitHub 图标 + 暗色/亮色切换 */
    #sidebar .sidebar-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #sidebar .sidebar-bottom .mode-toggle {
      margin-top: 0.5rem;
    }

    #sidebar .sidebar-bottom > * {
      width: 100%;
      text-align: center;
    }
  </style>
{% endif %}
