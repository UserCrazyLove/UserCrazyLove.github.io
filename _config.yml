# Jekyll + Chirpy（GitHub Pages 用 GitHub Actions 构建）
# Giscus 的 repo_id、category_id 需在 https://giscus.app 生成后填入下方。

theme: jekyll-theme-chirpy

lang: zh-CN
timezone: Asia/Shanghai

title: 我的个人博客
tagline: 记录学习与思考
description: >-
  基于 Jekyll Chirpy 主题与 GitHub Pages 的个人博客。

url: "https://userpvp.site"

github:
  username: usercrazylove

twitter:
  username:

social:
  name: usercrazylove
  email: weige3395481738@qq.com
  links:
    - https://github.com/usercrazylove

webmaster_verifications:
  google:
  bing:

analytics:
  google:
    id:

theme_mode:

comments:
  # 使用 Giscus（仓库需开启 Discussions；repo_id/category_id 在 https://giscus.app 获取）
  provider: giscus
  giscus:
    repo: usercrazylove/usercrazylove.github.io
    repo_id: R_kgDOSa3kig
    category: Announcements
    category_id: DIC_kwDOSa3kis4C81JC
    mapping: pathname
    strict: 0
    input_position: bottom
    lang: zh-CN
    reactions_enabled: 1

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths: []

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;︎"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
